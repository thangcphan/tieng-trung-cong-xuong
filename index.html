        for (let i = 4; i <= 30; i++) {

                lessonWords.push({
                    id: i * 100 + j,
                    chinese: `${base.c}${j > 0 ? (j % 2 === 0 ? '标' : '测') : ''}`,
                    pinyin: base.p,
                    vietnamese: `${base.v} (${i}.${j+1})`,
                    example: base.e,
                    examplePinyin: base.ep,
                    exampleVietnamese: base.ev
                });
            }
            factoryLessonsData.push({
                id: i,
                title: extraTitles[i - 4],
                desc: `Chuyên đề ${i}: ${extraTitles[i - 4]} chuyên sâu thực chiến nhà máy.`,
                words: lessonWords
            });

        const LessonsManager = {
            getAllLessons() {
                const saved = localStorage.getItem('factory_lessons_30_v3');

            },
            saveLessons(lessons) {
                localStorage.setItem('factory_lessons_30_v3', JSON.stringify(lessons));
            },
            addWordToLesson(lessonId, wordObj) {
                let lessons = this.getAllLessons();
                let lesson = lessons.find(l => l.id == lessonId);
                if (lesson) {
                    wordObj.id = Date.now();
                    lesson.words.push(wordObj);
                    this.saveLessons(lessons);
                    return true;
                }
                return false;
            }
        };

        const Store = {
            get(key, defaultValue) {
                const val = localStorage.getItem('factory_chinese_' + key);
                return val ? JSON.parse(val) : defaultValue;
            },
            set(key, value) {
                localStorage.setItem('factory_chinese_' + key, JSON.stringify(value));
            },
            getProgress() {
                return this.get('progress_30_v3', { completedLessons: [], learnedWords: [], wrongWords: [] });
            },
            markWordLearned(wordId) {
                let prog = this.getProgress();
                if (!prog.learnedWords.includes(wordId)) {
                    prog.learnedWords.push(wordId);
                    this.set('progress_30_v3', prog);
                }
            },
            markLessonCompleted(lessonId) {
                let prog = this.getProgress();
                if (!prog.completedLessons.includes(lessonId)) {
                    prog.completedLessons.push(lessonId);
                    this.set('progress_30_v3', prog);
                }
            },
            addWrongWord(word) {
                let prog = this.getProgress();
                if (!prog.wrongWords.some(w => w.id === word.id)) {
                    prog.wrongWords.push(word);
                    this.set('progress_30_v3', prog);
                }
            }
        };

                window.speechSynthesis.speak(utterance);

        function initFlashcardLogic(lessonsData) {
            const lesson = lessonsData.find(l => l.id == router.param);
            if (!lesson || lesson.words.length === 0) return;
            currentLessonWords = lesson.words;
            currentCardIndex = 0;
            isCardFlipped = false;
            updateFlashcardUI();
        }

        function updateFlashcardUI() {
            if (currentLessonWords.length === 0) return;
            const word = currentLessonWords[currentCardIndex];
            document.getElementById('fcChinese').innerText = word.chinese;
            document.getElementById('fcPinyin').innerText = word.pinyin;
            document.getElementById('fcBackChinese').innerText = word.chinese;
            document.getElementById('fcBackPinyin').innerText = word.pinyin;
            document.getElementById('fcBackMeaning').innerText = '🇻🇳 ' + word.vietnamese;
            document.getElementById('fcExChinese').innerText = word.example || word.chinese;
            document.getElementById('fcExPinyin').innerText = word.examplePinyin || word.pinyin;
            document.getElementById('fcExVietnamese').innerText = '→ ' + (word.exampleVietnamese || word.vietnamese);
            document.getElementById('cardCounter').innerText = `Thẻ: ${currentCardIndex + 1} / ${currentLessonWords.length}`;
            document.getElementById('progressBar').style.width = `${((currentCardIndex + 1) / currentLessonWords.length) * 100}%`;
            Store.markWordLearned(word.id);
            if (isCardFlipped) flipFlashcard(true);
        }

        function flipFlashcard(forceReset = false) {
            const inner = document.getElementById('flashcardInner');
            if (!inner) return;
            if (forceReset) { isCardFlipped = false; inner.style.transform = 'rotateY(0deg)'; return; }
            isCardFlipped = !isCardFlipped;
            inner.style.transform = isCardFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
        }

        function playCurrentAudio() { speakText(currentLessonWords[currentCardIndex].chinese); }
        function playExampleAudio() { speakText(currentLessonWords[currentCardIndex].example || currentLessonWords[currentCardIndex].chinese); }

        function nextCard() {
            if (currentCardIndex < currentLessonWords.length - 1) { currentCardIndex++; updateFlashcardUI(); }
            else { Store.markLessonCompleted(router.param); router.navigate('complete', router.param); }
        }
        function prevCard() { if (currentCardIndex > 0) { currentCardIndex--; updateFlashcardUI(); } }

        function renderQuizScreen(lessonId, lessonsData) {
            return `
                <div class="max-w-xl mx-auto space-y-6">
                    <div class="flex justify-between items-center">
                        <button onclick="router.navigate('study', ${lessonId})" class="p-2 rounded-xl bg-slate-200 dark:bg-slate-800"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                        <h2 class="font-bold">Trắc nghiệm ôn tập</h2>
                        <div id="quizCounter" class="text-xs font-bold text-brand-red"></div>
                    </div>
                    <div class="p-6 rounded-3xl bg-white dark:bg-slate-800 border shadow-xl space-y-6 text-center">
                        <div id="quizQuestion" class="text-4xl font-black text-brand-red">...</div>
                        <div id="quizPinyin" class="text-lg text-sky-600">...</div>
                        <div id="quizOptions" class="space-y-3"></div>
                    </div>
                </div>
            `;
        }

        let quizQuestions = [], quizIndex = 0;
        function initQuizLogic(lessonId, lessonsData) {
            const lesson = lessonsData.find(l => l.id == lessonId);
            if (!lesson || lesson.words.length === 0) return;
            quizQuestions = [...lesson.words].sort(() => 0.5 - Math.random()).slice(0, 5);
            quizIndex = 0;
            loadQuizQuestion(lessonsData);
        }

        function loadQuizQuestion(lessonsData) {
            if (quizIndex >= quizQuestions.length) { router.navigate('complete', router.param); return; }
            const current = quizQuestions[quizIndex];
            document.getElementById('quizCounter').innerText = `Câu ${quizIndex + 1}/${quizQuestions.length}`;
            document.getElementById('quizQuestion').innerText = current.chinese;
            document.getElementById('quizPinyin').innerText = current.pinyin;

            const lesson = lessonsData.find(l => l.id == router.param);
            let options = [current.vietnamese];
            while (options.length < 4 && options.length < lesson.words.length) {
                const randWord = lesson.words[Math.floor(Math.random() * lesson.words.length)];
                if (!options.includes(randWord.vietnamese)) options.push(randWord.vietnamese);
            }
            options.sort(() => 0.5 - Math.random());

            document.getElementById('quizOptions').innerHTML = options.map(opt => `
                <button onclick="checkQuizAnswer('${opt.replace(/'/g, "\\'")}', '${current.vietnamese.replace(/'/g, "\\'")}')" class="w-full p-4 rounded-xl bg-slate-100 dark:bg-slate-900 hover:bg-brand-red hover:text-white font-semibold text-left transition border">
                    ${opt}
                </button>
            `).join('');
        }

        function checkQuizAnswer(selected, correct) {
            if (selected !== correct) Store.addWrongWord(quizQuestions[quizIndex]);
            quizIndex++;
            render();
            initQuizLogic(router.param, LessonsManager.getAllLessons());
        }

        function renderCompleteScreen(lessonId, lessonsData) {
            return `
                <div class="max-w-md mx-auto text-center space-y-6 py-12">
                    <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-3xl mx-auto flex items-center justify-center text-4xl">🎉</div>
                    <h1 class="text-2xl font-black">HOÀN THÀNH BÀI HỌC!</h1>
                    <button onclick="router.navigate('lessons')" class="w-full py-4 rounded-xl bg-brand-red text-white font-bold shadow-lg">Chọn bài học khác</button>
                </div>
            `;
        }

        function renderDashboard(lessonsData) {
            const prog = Store.getProgress();
            const totalWords = lessonsData.reduce((acc, l) => acc + l.words.length, 0);
            return `
                <div class="max-w-2xl mx-auto space-y-6">
                    <button onclick="router.navigate('home')" class="text-xs font-bold text-slate-500 hover:text-brand-red">← Quay lại trang chủ</button>
                    <h1 class="text-2xl font-extrabold">📊 Tiến độ học tập</h1>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-5 rounded-2xl bg-white dark:bg-slate-800 border shadow-sm">
                            <div class="text-xs text-slate-400 uppercase font-bold">Đã học</div>
                            <div class="text-3xl font-black text-brand-red mt-1">${prog.learnedWords.length} / ${totalWords} từ</div>
                        </div>
                        <div class="p-5 rounded-2xl bg-white dark:bg-slate-800 border shadow-sm">
                            <div class="text-xs text-slate-400 uppercase font-bold">Bài hoàn thành</div>
                            <div class="text-3xl font-black text-brand-gold mt-1">${prog.completedLessons.length} / 30</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleGlobalSearch(keyword) {
            const container = document.getElementById('searchResults');
            if (!keyword.trim()) { container.innerHTML = ''; return; }
            const lessonsData = LessonsManager.getAllLessons();
            let matches = [];
            lessonsData.forEach(l => {
                l.words.forEach(w => {
                    if (w.chinese.includes(keyword) || w.pinyin.toLowerCase().includes(keyword.toLowerCase()) || w.vietnamese.toLowerCase().includes(keyword.toLowerCase())) {
                        matches.push({ ...w, lessonId: l.id, lessonTitle: l.title });
                    }
                });
            });
            container.innerHTML = matches.slice(0, 4).map(m => `
                <div onclick="router.navigate('study', ${m.lessonId})" class="p-3 rounded-xl bg-slate-50 dark:bg-slate-900 border cursor-pointer hover:border-brand-red flex justify-between items-center">
                    <div>
                        <div class="font-bold text-brand-red">${m.chinese} <span class="text-xs text-sky-600">(${m.pinyin})</span></div>
                        <div class="text-xs text-slate-600 dark:text-slate-300">${m.vietnamese}</div>
                    </div>
                    <span class="text-xs text-slate-400">${m.lessonTitle}</span>
                </div>
            `).join('') || '<div class="text-xs text-slate-400">Không tìm thấy từ vựng phù hợp.</div>';
        }

        render();
    </script>
</body>
</html>
